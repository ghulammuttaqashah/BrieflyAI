<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrieflyAI Settings</title><link rel="stylesheet" href="options.css"></head>
<body><main class="card"><div class="brand"><img class="brand-icon" src="icons.png" alt="" width="36" height="36" style="border-radius:10px;object-fit:cover"><div><strong>BrieflyAI</strong><small>Settings</small></div></div><p class="warning">AI access is managed by the BrieflyAI server. Your API key is not requested, stored, or sent by this extension.</p>
<form id="settingsForm"><label for="model">Groq model</label><select id="model" required></select><label for="summaryLength">Summary length</label><select id="summaryLength"><option value="short">Short</option><option value="medium">Medium</option><option value="long">Long</option></select><label for="language">Output language</label><input id="language" value="English" required><label for="style">Explanation style</label><select id="style"><option value="clear">Clear and balanced</option><option value="friendly">Friendly</option><option value="formal">Formal</option></select><label for="defaultMode">Default summary mode</label><select id="defaultMode"><option value="quick">Quick Summary</option><option value="detailed">Detailed Summary</option><option value="takeaways">Key Takeaways</option><option value="beginner">Beginner Mode</option><option value="technical">Technical Mode</option><option value="steps">Step-by-Step Guide</option></select><label for="theme">Theme</label><select id="theme"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select><button type="submit">Save settings</button><p id="status" role="status"></p></form></main><script type="module" src="options.js"></script></body></html>
