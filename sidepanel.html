<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrieflyAI</title><link rel="stylesheet" href="sidepanel.css"></head>
<body><main class="shell"><header><div class="brand"><img class="brand-icon" src="icons.png" alt=""><div><strong>BrieflyAI</strong><small>Read less, understand more.</small></div></div><button id="settings" class="settings-button" type="button"><span aria-hidden="true">⚙</span><span>Settings</span></button></header>
<section id="articleInfo" class="article-info"></section><div class="toolbar"><div class="mode-control"><label for="mode">Summary format</label><select id="mode"><option value="quick">Quick Summary</option><option value="detailed">Detailed Summary</option><option value="takeaways">Key Takeaways</option><option value="beginner">Beginner Mode</option><option value="technical">Technical Deep Dive</option><option value="steps">Step-by-Step Guide</option></select><small id="modeHint"></small></div><button id="summarize" class="primary">Summarize</button></div>
<div id="progress" class="progress" role="status"></div><article id="summary" class="markdown empty">Choose a mode and summarize this article.</article>
<div class="actions"><button id="copy" type="button">Copy</button><button id="save" type="button">Save</button><button id="original" type="button">Open original</button></div>
<section class="qa"><div class="qa-heading"><div><h2>Ask This Article</h2><p>Ask a focused question about the page.</p></div><span class="chat-status"><i></i>Article context ready</span></div><div id="chat"><div class="chat-empty">Ask a question to start a conversation about this article.</div></div><form id="questionForm"><input id="question" placeholder="Ask a question about this article..." autocomplete="off"><button aria-label="Ask" type="submit">↑</button></form></section>
</main><div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="sidepanel.js"></script></body></html>
